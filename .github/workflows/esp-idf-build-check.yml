name: Build(esp-idf-native)

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**'
      - 'CMakeLists.txt'
      - 'idf_component.yml'
      - '.github/workflows/esp-idf-build-check.yml'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**'
      - 'CMakeLists.txt'
      - 'idf_component.yml'
      - '.github/workflows/esp-idf-build-check.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# PlotToSerial has a Kconfig connection choice (common/Kconfig.variant): I2C (UnitUltraSonicI2C, default) or
# GPIO (UnitUltraSonicIO). The matrix has the connection axis and the chip axis:
# esp32 = classic Xtensa dual-core, esp32s3 = LCD-capable dual-core Xtensa with PSRAM,
# esp32c3 = RISC-V single-core (StampC3), esp32c6 (NanoC6) / esp32h2 (NanoH2) = RISC-V single-core which
# exercises the app_main CONFIG_FREERTOS_UNICORE feedIdle branch, esp32c5 = RISC-V single-core supported from
# IDF 5.5 (so it is on the v5.5.4 / v6.1 rows only), esp32p4 (M5Stack Tab5) = RISC-V dual-core;
# the sdkconfig.defaults.esp32p4 overlay (chip-rev minimum keys) is auto-applied.
# esp32s2 is not a target: M5Unified / M5GFX, which the examples use, do not build it (M5GFX 0.2.32 fails in
# Bus_SPI.hpp with -Werror=array-bounds on IDF 5.5). Add it when they support it.
# esp32c61 is not a target until there is M5Stack hardware with it (M5UnitUnified itself already builds it).
jobs:
  build-chips:
    name: ${{ matrix.idf }} ${{ matrix.target }} PlotToSerial(${{ matrix.connection }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        # Each connection uses its own wiring helper (addI2C / addGPIO), and the wiring helper branches per chip
        # (CONFIG_IDF_TARGET_* / SOC_I2C_NUM / SOC_LP_I2C_SUPPORTED), so both connections are built on every chip.
        # idf boundaries: 5.1.7 = oldest legacy-driver (5.0.x dropped: M5GFX needs esp_mm added
        # in 5.1), 5.4.4 = new driver/*_master.h era, 5.5.4 = latest 5.x, 6.1 = latest 6.x.
        # 6.x matters because default warnings become errors there (CONFIG_COMPILER_DISABLE_DEFAULT_ERRORS
        # defaults to n and common/sdkconfig.defaults does not override it), and GCC 15 / C++26 is the default.
        # Every chip is built on every boundary, because chip-specific code (wiring helper branches, M5Unified /
        # M5GFX per-chip paths, the CONFIG_FREERTOS_UNICORE feedIdle branch), the Xtensa / RISC-V toolchains and the
        # legacy I2C driver on 5.1.7 differ per chip, and esp32 alone does not catch their warnings.
        # The idf axis is built for the I2C connection only, because the I2C driver is what changes across these
        # versions (__has_include(<driver/i2c_master.h>)); GPIO is built on every chip with the latest 5.x.
        connection: [I2C, GPIO]
        target: [esp32, esp32s3, esp32c3, esp32c5, esp32c6, esp32h2, esp32p4]
        idf: [v5.1.7, v5.4.4, v5.5.4, v6.1]
        exclude:
          - {target: esp32c5, idf: v5.1.7}   # C5 is supported from IDF 5.5 (preview target on 5.4)
          - {target: esp32c5, idf: v5.4.4}
          - {target: esp32p4, idf: v5.1.7}   # P4 is supported from IDF 5.3
          - {connection: GPIO, idf: v5.1.7}
          - {connection: GPIO, idf: v5.4.4}
          - {connection: GPIO, idf: v6.1}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Kconfig variant
        # The example's own sdkconfig.defaults is not read (top CMakeLists points SDKCONFIG_DEFAULTS
        # at common/sdkconfig.defaults). Append the choice to common/ in the CI workspace only.
        if: matrix.connection == 'GPIO'
        run: |
          echo "" >> examples/UnitUnified/common/sdkconfig.defaults
          echo "CONFIG_EXAMPLE_CONNECT_VIA_GPIO=y" >> examples/UnitUnified/common/sdkconfig.defaults

      - name: ESP-IDF build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: examples/UnitUnified/UnitUltraSonic/PlotToSerial

  # DualSensor (I2C + GPIO units together) and ViaPaHub (M5Unit-HUB, example-only dependency) only add example code on
  # top of the library, whose chip and idf axes are already covered by build-chips. Build them on the representative
  # chip with the latest 5.x only.
  build-examples:
    name: v5.5.4 esp32 ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        example:
          - UnitUltraSonic/DualSensor
          - UnitUltraSonic/ViaPaHub
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ESP-IDF build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32
          path: examples/UnitUnified/${{ matrix.example }}
